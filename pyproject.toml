[project]
name = "ibid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "qdrant-client>=1.12",
    "fastembed>=0.6",
    "pandas>=2.0",
    "ir_measures>=0.3",
    "streamlit>=1.35",
]

# L'acceleratore ONNX e' un extra, e gli extra si escludono a vicenda: queste
# distribuzioni forniscono tutte lo stesso modulo `onnxruntime`, quindi
# installarne due insieme rompe l'import. Se non se ne installa nessuna,
# fastembed tira comunque `onnxruntime` (CPU) e il progetto funziona -- piu'
# lentamente, e `src/providers.py` lo dice invece di lasciarlo scoprire a run
# finita: ~2,4 embed/s contro ~10 misurati (I-07), cioe' un'ingestione da 2 ore
# che ne diventa 8.
#
# Solo `gpu-directml` e' provato: e' quello di sviluppo, su AMD RX 6750 XT.
# Gli altri due sono dichiarati perche' i provider corrispondenti sono in
# `PREFERRED_ACCELERATORS`, e verificarli davvero e' U-12 (Fase 8).
[project.optional-dependencies]
gpu-directml = ["onnxruntime-directml>=1.20"]   # Windows, qualunque GPU DirectX 12
gpu-rocm = ["onnxruntime-rocm>=1.20"]           # Linux + AMD — non verificato
gpu-cuda = ["onnxruntime-gpu>=1.20"]            # Linux/Windows + NVIDIA — non verificato

[tool.uv]
dev-dependencies = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.ruff.lint.per-file-ignores]
# E402 = import non in cima al file.
#
# Gli script di `scripts/` non sono un package e non sono installati: per
# importare `src.` devono prima mettere la radice del repo su `sys.path`, e
# quell'istruzione deve per forza precedere gli import. Il pattern e' deliberato
# ed e' l'unica ragione dei 50 E402 che ruff segnalava.
#
# **Questa e' una soppressione, non una correzione**, e va detto. La correzione
# vera e' installare il progetto (`pip install -e .`) e cancellare le tre righe
# di bootstrap da ogni script: hatchling e' gia' configurato piu' sotto, quindi
# manca solo il passo di installazione. Non si fa qui perche' oggi `python
# scripts/eval.py` funziona su un clone appena scaricato, e toglierlo e' un
# cambiamento del modo di lavorare, non igiene del codice. La Fase 7 ci arriva
# da sola: A-05 mette il backend in un container, dove il progetto **sara'**
# installato per forza.
#
# Perche' in configurazione e non con `# noqa: E402` riga per riga: erano una
# ventina di noqa messi in modo incoerente -- alcuni script li avevano tutti,
# altri nessuno -- e cinquanta commenti che dicono la stessa cosa sono peggio di
# una riga che la dice una volta con il motivo scritto.
"scripts/*" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "dashboard"]
