[project]
name = "ibid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "qdrant-client>=1.12",
    "fastembed>=0.6",
    "pandas>=2.0",
    "ir_measures>=0.3",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
