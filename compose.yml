# Il backend come servizio (A-05).
#
# **Il punto di questo file è un'assenza**: non contiene un solo indirizzo
# cablato. `QDRANT_URL` e `LLM_BASE_URL` arrivano dall'ambiente, e i default
# servono il caso comune — Qdrant nella rete di compose, l'LLM sulla macchina
# che ospita — senza impedire l'altro. Spostare Qdrant o l'LLM su un'altra
# macchina è una variabile, non una modifica al sorgente:
#
#     QDRANT_URL=http://10.0.0.5:6333 LLM_BASE_URL=http://10.0.0.7:11434/v1 \
#       docker compose up api
#
# `host.docker.internal` è l'host visto da dentro il container. Non è una
# scorciatoia: **dal punto di vista del container l'host È un'altra macchina**,
# con un'altra interfaccia di rete e un altro `localhost`. È anche il motivo per
# cui questo setup verifica il criterio pur girando tutto su un PC solo.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Qdrant nella rete di compose quando il profilo lo avvia; un indirizzo
      # qualunque quando non lo fa.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # L'LLM non è un servizio di questo compose: gira su Ollama o llama.cpp,
      # spesso già presente sulla macchina, e sempre con la GPU che questo
      # container non ha. Passarlo per ambiente è ciò che tiene il backend
      # portabile — vedi STACK.md: l'inferenza si raggiunge solo da qui.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      # Manopole di piattaforma, non di richiesta (§3.4 e la classificazione di
      # A-02): restano ambiente, e non compaiono nell'API.
      ONNX_PROVIDERS: ${ONNX_PROVIDERS:-}
    extra_hosts:
      # Su Linux `host.docker.internal` non esiste da solo. Con questa riga il
      # default sopra funziona sui tre sistemi invece che su due.
      - "host.docker.internal:host-gateway"
    volumes:
      # I pesi dei modelli: ~2,5 GB fra embedding, reranker e verificatore NLI.
      # Nell'immagine sarebbero layer; senza volume sarebbero un download a ogni
      # avvio, prima della prima risposta.
      - model_cache:/cache
    depends_on:
      qdrant:
        condition: service_healthy
        # Qdrant è opzionale: con `QDRANT_URL` che punta altrove il profilo non
        # viene avviato, e questa dipendenza non deve bloccare l'avvio.
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["full", "eval", "demo"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'immagine di Qdrant non ha né curl né wget: il suo stesso binario sa
      # dire se è vivo. Un healthcheck che non può girare lascia il servizio
      # `starting` per sempre, e `depends_on: service_healthy` non parte mai.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
